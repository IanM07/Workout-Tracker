plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weddingworkout.tracker.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.weddingworkout.tracker.v2'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.2.2'
    }

    signingConfigs {
        persistentDebug {
            storeFile file('workout-debug.keystore')
            storePassword 'workouttracker'
            keyAlias 'workouttracker'
            keyPassword 'workouttracker'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.persistentDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
